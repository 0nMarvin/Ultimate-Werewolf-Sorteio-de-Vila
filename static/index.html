<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<title>Ultimate Werewolf · Vila</title>
<style>
:root{--bg:#14121f;--card:#1f1b30;--line:#332d4a;--tx:#efe6d2;--mut:#a79fbd;--acc:#e8a33d;--ok:#6fbf8b;--bad:#d9645a;--vil:#7aa7e0;
--vampiro:#c0527a;--ind:#b58be0}
@media(prefers-color-scheme:light){:root{--bg:#f4eddc;--card:#fffaf0;--line:#dccfae;--tx:#2a2219;--mut:#7a6d57;--acc:#a8650b;--ok:#2f7d4f;--bad:#b3392f;--vil:#2f6aa8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Georgia,'Times New Roman',serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px;font-weight:700;letter-spacing:.2px}
.sum{display:flex;gap:10px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--mut)}
.pill b{color:var(--tx);font-size:17px}
.meter{position:relative;height:10px;border-radius:6px;margin-top:10px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--vil))}
.meter i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--tx);left:50%;transition:left .25s}
.status{margin-top:6px;font-size:14px;display:flex;justify-content:space-between}
.status b.equilibrada{color:var(--ok)}.status b.vila{color:var(--vil)}.status b.inimigos{color:var(--bad)}
.avisos{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--acc)}
.avisos li{padding:2px 0}
main{padding:12px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;min-height:40px}
.chip[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff;text-decoration:line-through}
.hint{font-size:12px;color:var(--mut);margin:2px 0 10px}
h2{font-size:15px;margin:18px 0 8px;color:var(--mut);font-weight:700}
.role{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--vil);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.role.lobos{border-left-color:var(--bad)}.role.vampiros{border-left-color:var(--vampiro)}.role.indep{border-left-color:var(--ind)}
.role.on{outline:2px solid var(--acc)}.role.off{opacity:.35}
.role .t{flex:1;min-width:0}.role .n{font-weight:700}.role .d{font-size:12.5px;color:var(--mut)}
.adj{font-size:12px;border-radius:8px;padding:1px 6px;margin-left:6px;background:var(--line);color:var(--tx)}
.adj.p{color:var(--vil)}.adj.m{color:var(--bad)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:22px;line-height:1}
.step button:disabled{opacity:.3}.step span{min-width:20px;text-align:center;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:16px 0;border:0;background:none;color:var(--mut);font:inherit;font-size:15px}
nav button[aria-selected=true]{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:9px;font:inherit}
.seg button[aria-pressed=true]{background:var(--acc);color:#14121f;font-weight:700}
.call{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.call.done{opacity:.4}
.call .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.call .who{font-weight:700;font-size:17px}.call .w{font-size:12px;color:var(--acc)}
.call q{display:block;margin:8px 0;font-style:italic;quotes:none}
.call .a{font-size:14px;color:var(--mut)}
.call label{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;min-height:36px}
.call input{width:22px;height:22px;accent-color:var(--acc)}
.warn{font-size:12px;color:var(--acc);margin-top:6px}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.small{font-size:13px;color:var(--mut)}
.adj.dado{background:var(--acc);color:#14121f}
.gen{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.gen .f{display:flex;gap:8px}.gen label{flex:1;font-size:12px;color:var(--mut)}
.gen input{width:100%;margin-top:3px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.gen .go{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#14121f;font:inherit;font-weight:700;font-size:16px}
.gen .go:disabled{opacity:.5}
.info{border:1px solid var(--line);background:none;color:var(--acc);border-radius:50%;width:30px;height:30px;font-size:15px;flex:none;padding:0}
dialog{width:min(92vw,520px);max-height:85vh;overflow:auto;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:16px}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 4px;font-size:19px}dialog p{margin:8px 0}dialog ul{padding-left:18px;margin:6px 0}
dialog .fechar{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#14121f;font:inherit;font-weight:700}
.call details{margin-top:8px;font-size:13.5px}.call summary{color:var(--acc);min-height:32px;display:flex;align-items:center}
.call details p{margin:6px 0;color:var(--tx)}
.reset{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;margin-top:14px}

.perfil{width:100%;margin-top:3px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.row2{display:flex;gap:8px;margin-bottom:8px}
.tag{font-size:11px;border-radius:8px;padding:1px 6px;margin-left:6px;background:var(--line);color:var(--mut)}
.fix{border:1px solid var(--line);background:none;border-radius:50%;width:34px;height:34px;font-size:15px;padding:0;flex:none}
details.g>summary{font-weight:700;color:var(--mut);padding:12px 0;list-style:none;display:flex;justify-content:space-between;min-height:44px}
details.g>summary::after{content:"▾"}details.g[open]>summary::after{content:"▴"}
.role.culto{border-left-color:var(--ind)}
.btns{display:flex;gap:8px;margin-top:10px}.btns .reset{margin-top:0}
.pl{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.pl.dead{opacity:.45}.pl label{flex:0 0 38%;font-size:13px;font-weight:700;line-height:1.2}
.pl input,.dia input,.dia textarea{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;width:100%}
.pl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;font-size:17px;padding:0;flex:none}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav2 button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:22px}
.dia .c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.dia .c b{display:block;font-size:14px;margin-bottom:6px}
.cfgrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cfgrow .t{flex:1;font-size:14px;font-weight:700}.cfgrow .t small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.cfgrow input{width:84px;flex:none;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;text-align:center}
.nota{font-size:12px;color:var(--ind);margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Ultimate Werewolf · Vila</h1>
  <div class="sum">
    <div class="pill"><b id="nJog">0</b> jogadores</div>
    <div class="pill"><b id="nIni">0</b> inimigos</div>
    <div class="pill">saldo <b id="saldo">0</b></div>
  </div>
  <div class="meter"><i id="mark"></i></div>
  <div class="status"><b id="stTxt" class="equilibrada">Escolha os papéis</b><span class="small" id="esp"></span></div>
  <ul class="avisos" id="avisos"></ul>
</header>

<main id="telaVila">
  <div class="gen">
    <div class="f">
      <label>Jogadores (6–68)<input id="gN" type="number" inputmode="numeric" min="6" max="68" value="12"></label>
      <label>Aldeões (máx.)<input id="gMax" type="number" inputmode="numeric" min="0" max="15" value="15"></label>
    </div>
    <div class="f" style="margin-top:8px">
      <label>Perfil do grupo<select class="perfil" id="gG"><option value="5">Não se conhecem (+5)</option><option value="0" selected>Misto (0)</option><option value="-5">Experiente (−5)</option></select></label>
      <label>Saldo alvo<input id="gA" type="number" inputmode="numeric" value="0"></label>
    </div>
    <button class="go" id="sortear">🎲 Sortear vila</button>
    <button class="reset" id="cfgBtn" style="width:100%;margin-top:8px">⚙ Configurações extras</button>
    <div id="cfg" hidden></div>
    <p class="hint" id="genMsg" style="color:var(--acc)"></p>
    <p class="hint" style="margin:8px 0 0">Papéis fixados (📌) ficam; o sorteio completa o resto.</p>
  </div>
  <div class="seg" id="segV"><button data-v="cat" aria-pressed="true">Categoria</button><button data-v="time" aria-pressed="false">Time</button><button data-v="esp" aria-pressed="false">Só específicos</button></div>
  <div id="vila"></div>
  <div class="btns"><button class="reset" id="fixarTudo">📌 Fixar tudo</button><button class="reset" id="limpar">Limpar vila</button></div>
</main>

<main id="telaPapeis" hidden>
  <h2 style="margin-top:4px">Remover grupos</h2>
  <div class="chips" id="filtros"></div>
  <p class="hint">Toque para tirar o grupo do jogo. Os papéis escolhidos aqui ficam fixos na vila.</p>
  <div id="catalogo"></div>
</main>

<main id="telaNarr" hidden>
  <div class="seg" id="segN">
    <button data-k="roteiro" aria-pressed="true">Roteiro</button>
    <button data-k="jogadores" aria-pressed="false">Jogadores</button>
    <button data-k="diario" aria-pressed="false">Diário</button>
  </div>
  <div id="pRoteiro">
    <div class="seg" id="seg">
      <button data-k="primeira" aria-pressed="true">1ª noite</button>
      <button data-k="seguintes" aria-pressed="false">Noites seguintes</button>
    </div>
    <div id="roteiro"></div>
  </div>
  <div id="pJog" hidden></div>
  <div id="pDia" hidden></div>
</main>

<nav>
  <button data-t="Vila" aria-selected="true">Vila</button>
  <button data-t="Papeis" aria-selected="false">Papéis</button>
  <button data-t="Narr" aria-selected="false">Narrador</button>
</nav>
<dialog id="dlg"></dialog>

<script>
const $=s=>document.querySelector(s);
let GRUPOS=[],LIMITAVEIS=[],padr={};
const GT={vila:'Time da vila',lobos:'Time dos lobos',vampiros:'Time dos vampiros',culto:'Time próprio (culto)'};
const labelG=g=>(GRUPOS.find(x=>x[0]===g)||[0,g])[1];
let visao='cat',ROLES=[],FILTROS=[],fixos={},gerados={},limites={},off=new Set(),dados=null,aba='primeira';
const q=n=>(fixos[n]||0)+(gerados[n]||0);
const total=()=>{const t={};for(const r of ROLES){const v=q(r.name);if(v)t[r.name]=v}return t};
const salvar=()=>{try{localStorage.setItem('uw2',JSON.stringify({fixos,gerados,limites,off:[...off]}))}catch(e){}};
const carregar=()=>{try{const s=JSON.parse(localStorage.getItem('uw2')||'{}');fixos=s.fixos||{};gerados=s.gerados||{};limites=s.limites||{};off=new Set(s.off||[])}catch(e){}};
const bloqueado=r=>r.tags.some(t=>off.has(t));
const sg=a=>a>0?'p':'m';

async function init(){
  const j=await (await fetch('/api/roles')).json();
  ROLES=j.roles;FILTROS=j.filtros;LIMITAVEIS=j.limitaveis;GRUPOS=j.categorias.map(c=>[c.id,c.label]);carregar();
  for(const k of Object.keys(fixos)) if(!ROLES.some(r=>r.name===k)) delete fixos[k];
  for(const k of Object.keys(gerados)) if(!ROLES.some(r=>r.name===k)) delete gerados[k];
  desenharFiltros();desenhar();atualizar();
}
function desenharFiltros(){
  $('#filtros').innerHTML=FILTROS.map(f=>`<button class="chip" data-t="${f.tag}" aria-pressed="${off.has(f.tag)}">${f.label}</button>`).join('');
}
function nomeHTML(r){return r.pt&&r.pt!==r.name?`${r.pt} <small style="color:var(--mut);font-weight:400">${r.name}</small>`:r.name}
function stepper(r){const v=q(r.name),b=bloqueado(r);
  return `<div class="step"><button data-d="-1" ${v?'':'disabled'} aria-label="Menos">−</button><span>${v}</span><button data-d="1" ${b||v>=r.max?'disabled':''} aria-label="Mais">+</button></div>`}
function linha(r,vila){
  const g=gerados[r.name]||0,f=fixos[r.name]||0,b=bloqueado(r);
  const tag=vila?`<span class="tag">${f?'📌 '+f:''}${f&&g?' · ':''}${g?'🎲 '+g:''}</span>`:'';
  return `<div class="role ${r.time} ${!vila&&q(r.name)?'on':''} ${b?'off':''}" data-n="${r.name}">
    <div class="t"><div class="n">${nomeHTML(r)}<span class="adj ${sg(r.adj)}">${r.adj>0?'+':''}${r.adj}</span>${tag}</div><div class="d">${r.acao}</div></div>
    ${vila&&g?'<button class="fix" data-f="1" aria-label="Fixar" title="Fixar na vila">📌</button>':''}
    <button class="info" data-i="1" aria-label="Detalhes">ⓘ</button>${stepper(r)}</div>`}
function desenhar(){
  // tela Vila: só os papéis que estão na vila
  let h='';
  if(visao==='esp'){
    const rs=ROLES.filter(r=>r.name!=='Villager'&&q(r.name)),nv=q('Villager');
    h=rs.map(r=>linha(r,true)).join('')+(nv?`<p class="small">+ ${nv} aldeão(ões) comum(ns), não listados aqui.</p>`:'');
  }else if(visao==='time'){
    for(const t of Object.keys(GT)){
      const rs=ROLES.filter(r=>r.time===t&&q(r.name));
      if(rs.length)h+=`<h2>${GT[t]} · ${rs.reduce((a,r)=>a+q(r.name),0)}</h2>`+rs.map(r=>linha(r,true)).join('');
    }
  }else for(const [g,rot] of GRUPOS){
    const rs=ROLES.filter(r=>r.grupo===g&&q(r.name));
    if(rs.length)h+=`<h2>${rot}</h2>`+rs.map(r=>linha(r,true)).join('');
  }
  $('#vila').innerHTML=h||'<div class="empty">Nenhum papel ainda.<br>Sorteie a vila ou escolha papéis na aba <b>Papéis</b>.</div>';
  // catálogo: todos os papéis, grupos recolhíveis
  const abertos=new Set([...document.querySelectorAll('#catalogo details[open]')].map(d=>d.dataset.g));
  $('#catalogo').innerHTML=GRUPOS.map(([g,rot])=>{
    const rs=ROLES.filter(r=>r.grupo===g),n=rs.reduce((a,r)=>a+q(r.name),0);
    return `<details class="g" data-g="${g}" ${abertos.has(g)||(!abertos.size&&g==='vila')?'open':''}><summary><span>${rot}</span><span>${n?n+' na vila':''}</span></summary>${rs.map(r=>linha(r,false)).join('')}</details>`}).join('');
}
function clique(e){
  const row=e.target.closest('.role');if(!row)return;
  const n=row.dataset.n,r=ROLES.find(x=>x.name===n);
  if(e.target.closest('.info')){abrir(r);return}
  if(e.target.closest('.fix')){fixos[n]=(fixos[n]||0)+(gerados[n]||0);delete gerados[n];desenhar();atualizar();return}
  const bt=e.target.closest('button[data-d]');if(!bt)return;
  if(bt.dataset.d==='1'){if(q(n)<r.max)fixos[n]=(fixos[n]||0)+1}
  else if(gerados[n]){gerados[n]--;if(!gerados[n])delete gerados[n]}
  else if(fixos[n]){fixos[n]--;if(!fixos[n])delete fixos[n]}
  const y=scrollY;desenhar();scrollTo(0,y);atualizar();
}
$('#segV').onclick=e=>{const k=e.target.dataset.v;if(!k)return;visao=k;
  document.querySelectorAll('#segV button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===k));desenhar()};
$('#vila').onclick=clique;$('#catalogo').onclick=clique;
$('#filtros').onclick=e=>{
  const t=e.target.dataset.t;if(!t)return;
  off.has(t)?off.delete(t):off.add(t);
  for(const r of ROLES) if(bloqueado(r)){delete fixos[r.name];delete gerados[r.name]}
  desenharFiltros();desenhar();atualizar();
};
function abrir(r){
  $('#dlg').innerHTML=`<h3>${nomeHTML(r)}</h3>
  <div class="small">${labelG(r.grupo)} · ${GT[r.time]} · valor ${r.adj>0?'+':''}${r.adj}${r.max>1?' · até '+r.max+' cartas':''}</div>
  <p><b>Resumo:</b> ${r.acao}</p>
  ${r.detalhe?`<p>${r.detalhe}</p>`:'<p class="small">Este papel não aparece no manual enviado; vale só o resumo da sua lista.</p>'}
  ${r.variantes&&r.variantes.length?'<p><b>Variantes do manual</b></p><ul>'+r.variantes.map(v=>`<li>${v}</li>`).join('')+'</ul>':''}
  <button class="fechar" onclick="dlg.close()">Fechar</button>`;
  $('#dlg').showModal();
}
function desenharCfg(){
  const n=Math.max(6,Math.min(68,+$('#gN').value||12));
  $('#cfg').innerHTML=`<p class="hint" style="margin:10px 0 2px">Máximo por categoria: o sorteio escolhe de 0 até esse valor (Investigadores: de 1). Se faltar gente para fechar a vila, completa e, se preciso, passa do máximo. Em branco = padrão para ${n} jogadores. Papéis fixados contam no limite.</p>`+
  LIMITAVEIS.map(c=>`<div class="cfgrow"><div class="t">${labelG(c)}<small>${ROLES.filter(r=>r.grupo===c).map(r=>r.pt||r.name).join(', ')}${c==='macons'?' · use 0, 2 ou 3':''}</small><small>padrão: ${padr[c]??'…'}</small></div>
    <input type="number" inputmode="numeric" min="0" max="20" data-c="${c}" value="${limites[c]??''}" placeholder="${padr[c]??''}"></div>`).join('')+
  '<button class="reset" id="cfgReset">Restaurar padrões</button>';
}
async function carregarPadroes(){
  const n=Math.max(6,Math.min(68,+$('#gN').value||12));
  try{padr=(await (await fetch('/api/padroes?n='+n)).json()).padroes}catch(e){}
  desenharCfg();
}
$('#cfgBtn').onclick=()=>{const c=$('#cfg');c.hidden=!c.hidden;if(!c.hidden)carregarPadroes()};
$('#cfg').oninput=e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value;v===''?delete limites[c]:limites[c]=Math.max(0,+v);salvar()};
$('#cfg').onclick=e=>{if(e.target.id==='cfgReset'){limites={};salvar();desenharCfg()}};
$('#gN').oninput=()=>{if(!$('#cfg').hidden)carregarPadroes()};
$('#gG').onchange=e=>{$('#gA').value=e.target.value};
$('#sortear').onclick=async()=>{
  const b=$('#sortear');b.disabled=true;
  try{
    const res=await fetch('/api/gerar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n:+$('#gN').value||12,alvo:+$('#gA').value||0,vmax:$('#gMax').value===''?15:+$('#gMax').value,sel:fixos,off:[...off],limites})});
    const j=await res.json();
    if(!res.ok){alert(j.erro||'Não foi possível sortear.');return}
    gerados=j.gerados;$('#genMsg').textContent=j.aviso||'';desenhar();atualizar();scrollTo(0,0);
  }finally{b.disabled=false}
};
$('#fixarTudo').onclick=()=>{for(const n in gerados)fixos[n]=(fixos[n]||0)+gerados[n];gerados={};desenhar();atualizar()};
$('#limpar').onclick=()=>{if(confirm('Limpar todos os papéis da vila?')){fixos={};gerados={};desenhar();atualizar()}};

async function atualizar(){
  salvar();
  const res=await fetch('/api/vila',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sel:total()})});
  dados=await res.json();const b=dados.balanco;
  $('#nJog').textContent=b.jogadores;$('#nIni').textContent=b.inimigos;$('#saldo').textContent=(b.total>0?'+':'')+b.total;
  const st=$('#stTxt');st.textContent=b.jogadores?b.texto:'Escolha os papéis';st.className=b.jogadores?b.status:'equilibrada';
  $('#esp').textContent=b.jogadores?`inimigos esperados: ~${b.esperados}`:'';
  const pos=Math.max(0,Math.min(100,50+b.total*(50/30)));$('#mark').style.left=`calc(${pos}% - 2px)`;
  $('#avisos').innerHTML=b.avisos.map(a=>`<li>⚠ ${a}</li>`).join('');
  desenharRoteiro();
  if(sub==='jogadores')desenharJog();if(sub==='diario')desenharDia();
}

const feitos=new Set();
// ---- anotações do narrador (jogadores e diário da noite) ----
let anot={jog:{},dia:{},noite:1},sub='roteiro';
try{anot=Object.assign(anot,JSON.parse(localStorage.getItem('uw3')||'{}'))}catch(e){}
const salvarA=()=>{try{localStorage.setItem('uw3',JSON.stringify(anot))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function desenharJog(){
  const nl=[],vl=[];
  for(const r of ROLES){const v=q(r.name);for(let i=0;i<v;i++){(r.name==='Villager'?vl:nl).push({k:r.name+'#'+i,r,i,v})}}
  const row=x=>{const a=anot.jog[x.k]||{};
    return `<div class="pl ${a.morto?'dead':''}"><label>${x.r.pt||x.r.name}${x.v>1?' '+(x.i+1):''}</label>
    <input data-k="${x.k}" value="${esc(a.nome)}" placeholder="Nome do jogador"><button data-m="${x.k}" aria-label="Vivo ou morto">${a.morto?'💀':'❤️'}</button></div>`};
  $('#pJog').innerHTML=(nl.length||vl.length)?
    nl.map(row).join('')+(vl.length?`<details class="g"><summary><span>Aldeões (${vl.length})</span></summary>${vl.map(row).join('')}</details>`:'')+
    '<p class="small">Anote quem recebeu cada papel. Os nomes aparecem como sugestão no Diário.</p>':
    '<div class="empty">Monte a vila primeiro.</div>';
}
$('#pJog').oninput=e=>{const k=e.target.dataset.k;if(!k)return;(anot.jog[k]=anot.jog[k]||{}).nome=e.target.value;salvarA()};
$('#pJog').onclick=e=>{const k=e.target.dataset.m;if(!k)return;const a=anot.jog[k]=anot.jog[k]||{};a.morto=!a.morto;salvarA();desenharJog()};
function desenharDia(){
  if(!dados||!dados.balanco.jogadores){$('#pDia').innerHTML='<div class="empty">Monte a vila primeiro.</div>';return}
  const n=anot.noite,nomes=Object.values(anot.jog).filter(a=>a.nome&&!a.morto).map(a=>a.nome);
  const passos=(dados.roteiro[n===1?'primeira':'seguintes']||[]).filter(p=>p.quando!=='ident'&&p.quando!=='trigger');
  const val=k=>esc(anot.dia[n+'|'+k]);
  $('#pDia').innerHTML=`<div class="dia"><datalist id="dl">${nomes.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
  <div class="nav2"><button data-nn="-1" ${n<=1?'disabled':''}>‹</button><b>Noite ${n}</b><button data-nn="1">›</button></div>
  ${passos.map(p=>{const k=p.nomes.join('+');return `<div class="c"><b>${p.papeis.join(' · ')}</b><input list="dl" data-k="${esc(k)}" value="${val(k)}" placeholder="Quem foi o alvo / resultado"></div>`}).join('')}
  <div class="c"><b>Eliminados na manhã seguinte</b><input list="dl" data-k="mortos" value="${val('mortos')}" placeholder="Quem morreu"></div>
  <div class="c"><b>Anotações</b><textarea rows="3" data-k="extra" placeholder="Votação do dia, suspeitas, lembretes...">${val('extra')}</textarea></div>
  <button class="reset" id="limparA">Limpar anotações da partida</button></div>`;
}
$('#pDia').oninput=e=>{const k=e.target.dataset.k;if(!k)return;anot.dia[anot.noite+'|'+k]=e.target.value;salvarA()};
$('#pDia').onclick=e=>{
  const d=e.target.closest('[data-nn]');
  if(d){anot.noite=Math.max(1,anot.noite+Number(d.dataset.nn));salvarA();desenharDia();return}
  if(e.target.id==='limparA'&&confirm('Apagar nomes dos jogadores e o diário das noites?')){anot={jog:{},dia:{},noite:1};salvarA();desenharJog();desenharDia()}
};
$('#segN').onclick=e=>{const k=e.target.dataset.k;if(!k)return;sub=k;
  document.querySelectorAll('#segN button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  $('#pRoteiro').hidden=k!=='roteiro';$('#pJog').hidden=k!=='jogadores';$('#pDia').hidden=k!=='diario';
  if(k==='jogadores')desenharJog();if(k==='diario')desenharDia()};
function desenharRoteiro(){
  const r=dados.roteiro,lista=r[aba]||[];
  if(!dados.balanco.jogadores){$('#roteiro').innerHTML='<div class="empty">Monte a vila primeiro: o roteiro aparece aqui só com os papéis ativos.</div>';return}
  let h=lista.map((p,i)=>{
    const id=aba+i+p.fala,d=feitos.has(id);
    return `<div class="call ${d?'done':''}"><div class="h"><span class="who">${p.papeis.join(' · ')}</span><span class="w">${p.quando_txt}</span></div>
      <q>“${p.fala}”</q><div class="a">${p.acao}</div>
      <details><summary>Regras detalhadas</summary>${p.nomes.map(n=>{const r=ROLES.find(x=>x.name===n);return `<p><b>${r.pt||r.name}:</b> ${r.detalhe||r.acao}</p>`+(r.variantes&&r.variantes.length?'<ul>'+r.variantes.map(v=>`<li>${v}</li>`).join('')+'</ul>':'')}).join('')}</details>
      ${p.conferir?'<div class="warn">⚠ Conferir texto/regra na sua carta</div>':''}
      <label><input type="checkbox" data-id="${id}" ${d?'checked':''}> Chamado</label></div>`}).join('');
  if(!lista.length)h='<div class="empty">Nenhum papel desta seleção age à noite.</div>';
  if(r.sem_acao.length)h+=`<p class="small">Sem chamada noturna: ${r.sem_acao.join(', ')}.</p>`;
  h+='<button class="reset" id="zerar">Desmarcar chamados</button>';
  $('#roteiro').innerHTML=h;
}
$('#roteiro').onchange=e=>{const id=e.target.dataset.id;if(!id)return;e.target.checked?feitos.add(id):feitos.delete(id);desenharRoteiro()};
$('#roteiro').onclick=e=>{if(e.target.id==='zerar'){feitos.clear();desenharRoteiro()}};
$('#seg').onclick=e=>{const k=e.target.dataset.k;if(!k)return;aba=k;
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));desenharRoteiro()};
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b===e.target));
  for(const k of ['Vila','Papeis','Narr'])$('#tela'+k).hidden=t!==k;scrollTo(0,0)};
init();
</script>
</body>
</html>
